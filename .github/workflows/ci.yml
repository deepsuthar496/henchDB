name: CI & Protected Release Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 2 * * *' # Nightly reliability pipeline
  workflow_dispatch:

jobs:
  pr-checks:
    name: PR Gate / ${{ matrix.os }} / ${{ matrix.profile }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        profile: [debug, release]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rustfmt check
        if: matrix.os == 'ubuntu-latest' && matrix.profile == 'debug'
        run: cargo fmt --all -- --check

      - name: Clippy check
        if: matrix.profile == 'debug'
        run: cargo clippy --all-targets -- -D warnings

      - name: Release compile check
        run: cargo check --release

      - name: Run Tests (${{ matrix.profile }})
        run: |
          if [ "${{ matrix.profile }}" = "release" ]; then
            cargo test --all-targets --release
          else
            cargo test --all-targets
          fi
        shell: bash

  release-gate:
    name: Protected Production Release Gate / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [pr-checks]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Full Release Gate Pipeline (16 Mandatory Gates)
        run: python scripts/release_gate.py

  memory-sanitizers:
    name: Memory Sanitizers (ASan, UBSan, TSan)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install Nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Run AddressSanitizer & UndefinedBehaviorSanitizer
        env:
          RUSTFLAGS: "-Zsanitizer=address"
        run: cargo test -p engine ebr_stress crash_matrix --target x86_64-unknown-linux-gnu

      - name: Run ThreadSanitizer
        env:
          RUSTFLAGS: "-Zsanitizer=thread"
        run: cargo test -p engine ebr_stress --target x86_64-unknown-linux-gnu

  miri-verification:
    name: Miri Memory Safety Verification
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install Nightly Rust & Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Verify EBR Epoch Reclamation Under Miri
        run: cargo miri test -p engine --lib epoch -- --nocapture

  nightly-deep-validation:
    name: Nightly Scale & Soak Validation (Large-DB, Perf, Soak)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Release Binary
        run: cargo build --release

      - name: Run Large-Database Qualification
        run: python scripts/largedb.py --rows 50000 --batch 2000

      - name: Run Performance Regression Benchmark
        run: python scripts/perf_gate.py --rows 25000

      - name: Run Continuous Concurrency Soak (5m Nightly Qualification)
        run: python scripts/soak.py --duration 300 --threads 8

      - name: Upload Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-failure-artifacts
          path: |
            target/
            *.log
          if-no-files-found: ignore
